<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Trump Account Gift Cards</title>
    <meta name="description" content="Give a gift they can spend today — and invest for a lifetime. Trump Account Gift Cards split your gift between a prepaid Visa card and a child's tax-advantaged Trump Account." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://trumpaccountgiftcards.com/" />

    <!-- Open Graph / social share (absolute URLs required by social scrapers). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trump Account Gift Cards" />
    <meta property="og:title" content="The Gift Card That Builds Their Future" />
    <meta property="og:description" content="Give a gift they can spend today — and invest for a lifetime. Split between a prepaid Visa card and a child's tax-advantaged Trump Account." />
    <meta property="og:url" content="https://trumpaccountgiftcards.com/" />
    <meta property="og:image" content="https://trumpaccountgiftcards.com/opengraph.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Gift Card That Builds Their Future" />
    <meta name="twitter:description" content="Give a gift they can spend today — and invest for a lifetime, with a child's tax-advantaged Trump Account." />
    <meta name="twitter:image" content="https://trumpaccountgiftcards.com/opengraph.jpg" />

    <!-- Fonts: single request in <head>, preconnected. Avoids the render-blocking
         CSS @import chain (was also duplicated in index.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
